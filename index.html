<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1d3a" />
    <meta
      name="description"
      content="MathRacing - lumba matematik luar talian untuk Tahun 1 dan Tahun 2."
    />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>MathRacing</title>
    <!-- Launch splash: inline so it shows before any script loads (src/app/screens/SplashScreen.ts). -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        grid-template-rows: 1fr auto auto;
        place-items: center;
        overflow: hidden;
        color: #fff;
        font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(180deg, #0ea5e9 0%, #38bdf8 38%, #0b1d3a 38.2%, #12305f 100%);
        transition: opacity 350ms ease;
        cursor: pointer;
      }
      .splash-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-brand {
        display: grid;
        justify-items: center;
        gap: 0.4rem;
        text-align: center;
        align-self: center;
        padding-top: 4vh;
        animation: splash-pop 700ms cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      .splash-logo {
        width: clamp(88px, 18vmin, 200px);
        height: auto;
        border-radius: 22%;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
      }
      .splash-title {
        margin: 0.3em 0 0;
        font-size: clamp(40px, 9vmin, 120px);
        font-weight: 900;
        letter-spacing: 0.02em;
        text-shadow:
          0 6px 0 #0b1d3a,
          0 10px 30px rgba(0, 0, 0, 0.4);
      }
      .splash-tagline {
        margin: 0;
        font-size: clamp(18px, 3vmin, 36px);
        font-weight: 700;
        opacity: 0.95;
      }
      .splash-road {
        position: relative;
        width: 100%;
        height: clamp(90px, 20vmin, 220px);
        background: #334155;
        border-top: 6px solid #e2e8f0;
        border-bottom: 6px solid #e2e8f0;
      }
      .splash-road::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 6px;
        margin-top: -3px;
        background: repeating-linear-gradient(90deg, #f8fafc 0 48px, transparent 48px 96px);
        opacity: 0.6;
      }
      .splash-car {
        position: absolute;
        left: 0;
        width: clamp(80px, 16vmin, 180px);
        height: calc(clamp(80px, 16vmin, 180px) * 0.87);
        transform: translateX(-120%);
      }
      .splash-car svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .splash-car-1 {
        top: 2%;
      }
      .splash-car-2 {
        top: 40%;
      }
      .splash-car-3 {
        top: 20%;
      }
      .splash-live .splash-car-1 {
        animation: splash-drive 2.6s cubic-bezier(0.5, 0, 0.3, 1) 0.1s infinite !important;
      }
      .splash-live .splash-car-2 {
        animation: splash-drive 2.6s cubic-bezier(0.5, 0, 0.3, 1) 0.5s infinite !important;
      }
      .splash-live .splash-car-3 {
        animation: splash-drive 2.6s cubic-bezier(0.5, 0, 0.3, 1) 0.9s infinite !important;
      }
      .splash.splash-still .splash-car,
      .splash.splash-still .splash-brand {
        animation: none !important;
      }
      .splash.splash-still .splash-car {
        transform: none;
      }
      .splash.splash-still .splash-car-1 {
        left: 20%;
      }
      .splash.splash-still .splash-car-2 {
        left: 45%;
      }
      .splash.splash-still .splash-car-3 {
        left: 70%;
      }
      .splash-status {
        margin: 0;
        padding: 2.5vh 1rem 4vh;
        font-size: clamp(16px, 2.4vmin, 26px);
        font-weight: 700;
        opacity: 0.85;
      }
      @keyframes splash-drive {
        from {
          transform: translateX(-120%);
        }
        to {
          transform: translateX(105vw);
        }
      }
      @keyframes splash-pop {
        from {
          transform: scale(0.6);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" role="status" aria-live="polite">
      <div class="splash-brand">
        <img class="splash-logo" src="./icons/icon.svg" alt="" width="200" height="200" />
        <h1 class="splash-title">MathRacing</h1>
        <p class="splash-tagline" data-splash-tagline>Lumba matematik untuk Tahun 1 dan Tahun 2</p>
      </div>
      <div class="splash-road" aria-hidden="true">
        <span class="splash-car splash-car-1"></span>
        <span class="splash-car splash-car-2"></span>
        <span class="splash-car splash-car-3"></span>
      </div>
      <p class="splash-status" data-splash-status>Memuatkan...</p>
    </div>
    <div id="app"></div>
    <noscript>
      <style>
        .splash {
          display: none;
        }
      </style>
      MathRacing memerlukan JavaScript. / MathRacing needs JavaScript.
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
